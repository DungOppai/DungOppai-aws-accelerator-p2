apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: w9-day-a-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/<YOUR_GITHUB_USERNAME>/<YOUR_REPO_NAME>.git'
    targetRevision: HEAD
    path: cloud/w9/day-a/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
